name: sync-upstream-linux

# Keeps this soft fork in step with upstream and releases a matching Linux build.
#
# Upstream tags are named `open-design-vX.Y.Z`; this fork releases as `vX.Y.Z`.
# Every run:
#   1. resolves the newest stable tag published by upstream (`nexu-io/open-design`),
#      keeping its exact ref name for the fetch,
#   2. skips when this fork has already released that version,
#   3. otherwise merges the upstream tag into the fork's tree and pushes a
#      `v<version>` tag pointing at the merge commit.
#
# Pushing that tag is what `release-linux.yml` listens for, so the packages are
# always built from the upstream version's code plus this fork's Linux packaging
# delta, and published under the matching version number.
#
# Disable the schedule with the repository variable `AUTO_RELEASE_UPSTREAM=false`.

on:
  schedule:
    # Every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version to sync and release, for example 0.26.0. Empty = newest upstream stable tag."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-upstream-linux
  cancel-in-progress: false

jobs:
  sync-and-release:
    name: Sync upstream and prepare the release tag
    if: ${{ vars.AUTO_RELEASE_UPSTREAM != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      tag: ${{ steps.upstream.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REMOTE: https://github.com/nexu-io/open-design.git
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve upstream version
        id: upstream
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          # Upstream tags are named `open-design-vX.Y.Z`, while this fork releases
          # as `vX.Y.Z`. Normalize the request to a bare version, then look the
          # EXACT upstream tag name back up so the fetch never guesses a prefix.
          # A quiet fork (no stable tag yet) is a skip, never a failure.
          set -uo pipefail
          raw_tags="$(git ls-remote --tags --refs "$UPSTREAM_REMOTE" | awk -F/ '{print $NF}')"
          if [ -n "${REQUESTED_VERSION}" ]; then
            version="$(printf '%s' "${REQUESTED_VERSION}" | sed -E 's/^open-design-//; s/^v//')"
          else
            version="$(printf '%s\n' "$raw_tags" \
              | sed -E 's/^open-design-//; s/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1 || true)"
          fi
          if [ -z "${version}" ]; then
            echo "no upstream stable release tag found; nothing to do"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          upstream_tag=""
          for candidate in "open-design-v${version}" "v${version}"; do
            if printf '%s\n' "$raw_tags" | grep -Fxq "$candidate"; then
              upstream_tag="$candidate"
              break
            fi
          done
          if [ -z "${upstream_tag}" ]; then
            echo "resolved version ${version} but no matching upstream tag exists; nothing to do"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Upstream target: ${upstream_tag} -> release v${version}"

      - name: Decide whether a release is needed
        id: check
        if: ${{ steps.upstream.outputs.found == 'true' }}
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -uo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No release yet for this version. The tag may already exist (a push that
          # earlier got past the push but not the dispatch) — build it rather than
          # clobber it, and skip the merge/push half of this job.
          echo "needed=true" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists; building it without re-pushing"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the upstream tag into the fork
        if: ${{ steps.check.outputs.needed == 'true' && steps.check.outputs.tag_exists == 'false' }}
        env:
          # The upstream ref (open-design-vX.Y.Z) is not our release tag (vX.Y.Z);
          # fetching ours from upstream would fail with "couldn't find remote ref".
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          git config user.name "open-design-linux automation"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REMOTE"
          git fetch --no-tags upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          if git merge-base --is-ancestor "$UPSTREAM_TAG" HEAD; then
            echo "$UPSTREAM_TAG is already contained in main"
            exit 0
          fi
          base="$(git rev-parse HEAD)"
          # A conflict here fails the job loudly and stops the release: we never
          # publish Linux packages from a half-merged upstream tree.
          git merge --no-commit --no-ff "$UPSTREAM_TAG"
          # Publish the fork's OWN workflow tree. This repo only watches releases
          # and builds Linux (everything upstream has been disabled here), and the
          # default GITHUB_TOKEN is not allowed to push any change under
          # .github/workflows/ — upstream's churn would be rejected outright.
          rm -rf .github/workflows
          git checkout "$base" -- .github/workflows
          git add -A .github/workflows
          if [ -n "$(git diff --name-only "$base" -- .github/workflows)" ]; then
            echo "workflow tree still differs from the fork's own after restore:" >&2
            git diff --name-only "$base" -- .github/workflows >&2
            exit 1
          fi
          git commit --no-edit

      - name: Push the release trigger tag
        if: ${{ steps.check.outputs.needed == 'true' && steps.check.outputs.tag_exists == 'false' }}
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          # Only the tag is pushed, not main: it records the merge commit so the
          # release builds exactly this verified tree.
          git push origin "HEAD:refs/tags/$TAG"
          echo "pushed $TAG"

      - name: Summary
        run: |
          {
            echo "## Linux soft-fork sync"
            echo ""
            echo "- upstream tag: \`${{ steps.upstream.outputs.upstream_tag }}\`"
            echo "- release tag: \`${{ steps.upstream.outputs.tag }}\`"
            echo "- action needed: \`${{ steps.check.outputs.needed }}\`"
            echo "- tag already present: \`${{ steps.check.outputs.tag_exists }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # A reusable-workflow call runs in this run's job context, so it keeps
  # `contents: write`. A workflow we dispatched with GITHUB_TOKEN instead gets a
  # read-only token and cannot create the release (HTTP 403).
  linux-release:
    name: Build Linux packages and publish
    needs: sync-and-release
    if: ${{ needs.sync-and-release.outputs.needed == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ needs.sync-and-release.outputs.tag }}
